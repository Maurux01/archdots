# ─────────────────────────────────────────────────────────────────────────────
#  archdots · polybar (ligera)
#  Una sola barra: workspaces, título, reloj, volumen, cpu, memoria, disco,
#  batería y systray. Sin módulos de red ni clima para mantenerla simple.
# ─────────────────────────────────────────────────────────────────────────────

[colors]
background     = #1e1e2e
foreground     = #cdd6f4
surface        = #313244
rosewater      = #f5e0dc
mauve          = #cba6f7
red            = #f38ba8
peach          = #fab387
yellow         = #f9e2af
green          = #a6e3a1
teal           = #94e2d5
blue           = #89b4fa

; -----------------------------------------------------------------------------
; Barra
; -----------------------------------------------------------------------------

[bar/main]
width  = 100%
height = 28
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

border-size = 0
line-size   = 2
line-color  = ${colors.mauve}

padding-left  = 8
padding-right = 8
module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=11;2"
font-1 = "JetBrainsMono Nerd Font:size=12;2"

modules-left   = menu xworkspaces xwindow
modules-center = date
modules-right  = pulseaudio cpu memory filesystem battery systray

cursor-click  = pointer
cursor-scroll = ns-resize
enable-ipc    = true

; -----------------------------------------------------------------------------
; Ajustes globales
; -----------------------------------------------------------------------------

[settings]
screenchange-reload = true
pseudo-transparency = false

; -----------------------------------------------------------------------------
; Módulos
; -----------------------------------------------------------------------------

[module/menu]
type = custom/text
format = "  "
format-font = 1
format-foreground = ${colors.blue}
click-left = rofi -show drun
click-right = ~/.local/bin/powermenu.sh

[module/xworkspaces]
type = internal/xworkspaces

label-active             = %name%
label-active-background  = ${colors.surface}
label-active-foreground  = ${colors.mauve}
label-active-padding     = 2

label-occupied           = %name%
label-occupied-foreground = ${colors.blue}
label-occupied-padding   = 2

label-urgent             = %name%
label-urgent-background  = ${colors.red}
label-urgent-padding     = 2

label-empty              = %name%
label-empty-foreground   = ${colors.foreground}
label-empty-padding      = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
label-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 1
date = "%a %d %b  %H:%M"
label = " 󰸁 %date% "
label-foreground = ${colors.foreground}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5

format-volume            = "<ramp-volume> <label-volume>"
format-volume-foreground = ${colors.teal}
label-volume             = %percentage%%

ramp-volume-0 = " "
ramp-volume-1 = " "
ramp-volume-2 = " "

label-muted             = " 󰝟 mute "
label-muted-foreground  = ${colors.red}

click-right = pavucontrol

[module/cpu]
type = internal/cpu
interval = 2
format-foreground = ${colors.peach}
label = "  %percentage%% "

[module/memory]
type = internal/memory
interval = 2
format-foreground = ${colors.yellow}
label = "  %gb_used%G "

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted-foreground = ${colors.green}
label-mounted = " 󰋊 %percentage_used%% "

; En equipos de escritorio sin batería, comenta este bloque y quita
; "battery" de modules-right en [bar/main].
[module/battery]
type = internal/battery
battery = BAT0
adapter = ADP1
full-at = 95
low-at  = 10
poll-interval = 5

format-charging          = "<ramp-charge> <label-charging>"
format-discharging       = "<ramp-capacity> <label-discharging>"
format-full              = "<animation-charging> <label-full>"
format-low               = "<ramp-capacity> <label-low>"
format-low-foreground    = ${colors.red}

label-charging    = %percentage%%
label-discharging = %percentage%%
label-full        = full
label-low         = LOW %percentage%%

ramp-capacity-0 = " 󰂃"
ramp-capacity-1 = " 󰂄"
ramp-capacity-2 = " 󰂄"
ramp-charge-0   = " 󱟠"
ramp-charge-1   = " 󱟠"
animation-charging-0 = " 󰂄"
animation-charging-1 = " 󱟟"
animation-charging-framerate = 700

[module/systray]
type = internal/tray
format-margin = 4pt
tray-spacing = 8pt
