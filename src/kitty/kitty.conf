# ─────────────────────────────────────────────────────────────────────────────
#  archdots · kitty
#  Terminal por defecto. Paleta Catppuccin Mocha.
# ─────────────────────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
font_size        11.0
bold_font        auto
italic_font      auto

# Ajustes pensados para programar en terminal (Neovim, TUI, etc.)
modify_font cell_height 102%
disable_ligatures never

# i3 ya dibuja los bordes: evitamos decoración doble (en Linux usar 'yes').
hide_window_decorations yes

background              #1e1e2e
foreground              #cdd6f4
cursor                  #f5e0dc
cursor_text_color       #1e1e2e
selection_foreground    #cdd6f4
selection_background    #45475a

url_color               #89b4fa

color0  #11111b   # black
color1  #f38ba8   # red
color2  #a6e3a1   # green
color3  #f9e2af   # yellow
color4  #89b4fa   # blue
color5  #cba6f7   # magenta
color6  #94e2d5   # cyan
color7  #cdd6f4   # white
color8  #585b70   # bright black
color9  #f38ba8   # bright red
color10 #a6e3a1   # bright green
color11 #f9e2af   # bright yellow
color12 #89b4fa   # bright blue
color13 #cba6f7   # bright magenta
color14 #94e2d5   # bright cyan
color15 #f5e0dc   # bright white

window_padding_width        10
scrollback_lines            5000
wheel_scroll_multiplier     5.0
enable_audio_bell           no
visual_bell                 no
mouse_hide_wait             3.0
cursor_blink_interval       -1
background_opacity          1.0
confirm_os_window_close     0

# Atajos propios de kitty
map ctrl+shift+equal    change_font_size all +2.0
map ctrl+shift+minus    change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+z        scroll_to_prompt -1
map ctrl+shift+x        scroll_to_prompt 1
map ctrl+shift+f10      toggle_maximized
