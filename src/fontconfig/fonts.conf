<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  archdots · JetBrains Mono Nerd Font como monospace preferida.
  Así kitty, Neovim (en su repo aparte), rofi y polybar usan la misma fuente
  y pueden dibujar los glifos Nerd sin mostrar cuadros (tofu).
-->
<fontconfig>
  <!-- Alias: JetBrains Mono -> JetBrainsMono Nerd Font -->
  <alias binding="strong">
    <family>JetBrains Mono</family>
    <prefer><family>JetBrainsMono Nerd Font</family></prefer>
  </alias>

  <!-- Monospace del sistema = JetBrains Mono Nerd Font -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrains Mono</family>
      <family>Monospace</family>
    </prefer>
  </alias>

  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
    </edit>
  </match>

  <!-- SIEMPRE hinting mínimo y antialiasing para terminal -->
  <match target="font">
    <test name="family" compare="eq"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
